<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Gian Carlo Robles</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>

<body>

    <h1>Meta</h1>
    <p>This page includes stats about the code of this website, computed from every line of code and the commit that last changed it.</p>

    <!-- Lab 8 Step 1.1: time slider -->
    <div id="time-filter">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
        </label>
        <time id="commit-time"></time>
    </div>

    <h2>Summary</h2>
    <div id="stats"></div>

    <h2>Commits by time of day</h2>

    <!-- Lab 8 Step 3.1: story on the left, sticky scatter plot on the right -->
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-hour"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>

    <!-- Lab 8 Step 2: unit visualization of file sizes -->
    <h2>Files by size</h2>
    <dl id="files"></dl>

</body>
</html>
